name: Publish

# Push a tag like v1.2.3 to publish NuGet, npm and container packages to GitHub Packages.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Package version (e.g. 0.1.0-preview.1)
        required: true

permissions:
  contents: read
  packages: write

env:
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  nuget:
    name: NuGet packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Normalize version
        run: echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"
      - run: dotnet test Notes.slnx -c Release
      - run: dotnet pack Notes.slnx -c Release --no-build -o artifacts -p:Version="$VERSION"
      - name: Push to GitHub Packages
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --skip-duplicate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nuget-packages
          path: artifacts/*.nupkg

  npm:
    name: npm package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Normalize version
        run: echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm test
      - run: npm pkg set version="$VERSION" -w @xcfa/notes-api-client
      - run: npm publish -w @xcfa/notes-api-client
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: API container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/notes-api
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: src/Notes.Api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
